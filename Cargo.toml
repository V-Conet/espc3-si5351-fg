[package]
name = "espc3-si5351-fg"
version = "0.1.0"
authors = ["V-Conet <v-conet@outlook.com>"]
edition = "2021"
resolver = "2"
rust-version = "1.82"
license = "MIT"

[[bin]]
name = "espc3-si5351-fg"
harness = false # do not use the built-in cargo test harness -> resolve rust-analyzer errors

[profile.release]
opt-level = "s"
lto = true
debug = false
strip = true
codegen-units = 1

[profile.dev]
debug = true    # Symbols are nice, and they don't increase the size on Flash
opt-level = "z"

[dependencies]
log = "0.4"
anyhow = "1"
embedded-svc = "0.29"
esp-idf-svc = { version = "0.53", features = ["critical-section", "embassy-time-driver", "embassy-sync"] }
# Required by esp-idf-svc's `embassy-time-driver` feature (provides the timer queue symbols).
embassy-time = { version = "0.5", features = ["generic-queue-8"] }

[build-dependencies]
embuild = "0.33.5"
